version: 1
policy:
  unsupported_behavior: "Show explicitly. Do not imply full support."
  local_processing: "Required unless a future feature is clearly marked online."

groups:
  media:
    verified:
      - from: mp4
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and encodes MP3 through libmp3lame after runtime encoder probing. Optional start/end-second trim limits the exported range."
      - from: mp4
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Manual mode exposes video/audio controls and trim range; fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate while trim still applies. Video frame interpolation mode provides 2× RIFE optical flow frame interpolation via NCNN Vulkan. Manual-mode advanced filters apply where selected."
      - from: mp4
        to: mkv
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Manual mode exposes video/audio controls; fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate. Manual-mode advanced filters apply. Subtitles, attachments, and extra tracks are not copied."
      - from: video
        to: mov
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path for video inputs. Encodes the first video track with H.264/H.265 and writes AAC audio in a QuickTime MOV container. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate; manual-mode advanced filters apply."
      - from: multiple-videos
        to: mp4-mkv-mov
        engine: ffmpeg-compatible
        status: stable
        note: "Video merge path. Concatenates multiple selected video files in order using FFmpeg filter_complex concat with aspect-ratio letterboxing/pillarboxing (scale+pad) and audio track normalization."
      - from: video
        to: gif
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg animated GIF output for video inputs. Uses palettegen/paletteuse, drops audio/subtitles/data streams, loops by default, and automatically limits output to the selected range's first 30 seconds, 30 fps, and 900 frames. GIF resolution defaults to a 480 px short side with 720 px and Original options."
      - from: video
        to: contact-sheet-jpg-png
        engine: native
        status: stable
        note: "Video overview contact sheet output (JPG/PNG) for video inputs. Samples evenly spaced frames across the video duration (or within the selected trim range) into a customizable grid (3x3, 3x4, 4x4, 5x5) using hardware-accelerated MediaMetadataRetriever downsampling with FFprobe metadata probing. Renders on native Canvas with comprehensive media metadata header, Apple-style top-right watermark capsule badge with app logo, and timestamp overlay on each frame."
      - from: mkv
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate."
      - from: mov
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate."
      - from: webm
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate."
      - from: avi
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate."
      - from: 3gp
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate."
      - from: 3gpp
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "Alias of 3GP for routing. Uses the same FFmpeg re-encode path and fixed video compression presets."
      - from: ts
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "FFmpeg re-encode path. Encodes the first video track with H.264/H.265 and writes AAC audio. Fixed compression presets own CRF/preset/resolution/frame-rate strategy and AAC audio bitrate."
      - from: mts
        to: mp4
        engine: ffmpeg-compatible
        status: stable
        note: "TS-family alias for routing. Uses the same FFmpeg re-encode path and fixed video compression presets."
      - from: mp3
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Re-encodes MP3 through libmp3lame after runtime encoder probing. Bitrate, sample rate, channel, and advanced audio filter controls are passed when selected."
      - from: m4a
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes MP3 through libmp3lame after runtime encoder probing. Advanced audio filters apply where selected."
      - from: flac
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes MP3 through libmp3lame after runtime encoder probing. Advanced audio filters apply where selected."
      - from: wav
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes MP3 through libmp3lame after runtime encoder probing. Advanced audio filters apply where selected."
      - from: wma
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Decodes WMA through FFmpeg and encodes MP3 through libmp3lame after runtime encoder probing. Advanced audio filters apply where selected."
      - from: mp3
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes AAC in an M4A container through FFmpeg compatibility mode. Bitrate, sample-rate, channel, and advanced audio filter controls are passed when selected."
      - from: m4a
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Re-encodes AAC in an M4A container through FFmpeg compatibility mode. This is not audio stream copy; advanced audio filters apply where selected."
      - from: flac
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Decodes through FFmpeg and encodes AAC in an M4A container. Bitrate, sample-rate, channel, and advanced audio filter controls are passed when selected."
      - from: wav
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Decodes through FFmpeg and encodes AAC in an M4A container. Bitrate, sample-rate, channel, and advanced audio filter controls are passed when selected."
      - from: wma
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Attempts AAC in M4A through FFmpeg compatibility mode; may fail if the package lacks AAC encoding. Advanced audio filters apply where selected."
      - from: ogg
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Decodes through FFmpeg and encodes AAC in an M4A container when the bundled decoders can read the source. Advanced audio filters apply where selected."
      - from: mp3
        to: wav
        engine: ffmpeg-compatible
        status: stable
        note: "Writes PCM WAV. Sample rate, channel, and advanced audio filter controls are passed when selected; bitrate is not used."
      - from: m4a
        to: wav
        engine: ffmpeg-compatible
        status: stable
        note: "Writes PCM WAV through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: flac
        to: wav
        engine: ffmpeg-compatible
        status: stable
        note: "Writes PCM WAV through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: wav
        to: wav
        engine: ffmpeg-compatible
        status: stable
        note: "Rewrites PCM WAV; bitrate is not used. Advanced audio filters apply where selected."
      - from: wma
        to: wav
        engine: ffmpeg-compatible
        status: stable
        note: "Decodes WMA through FFmpeg and writes PCM WAV when the bundled codecs are available. Advanced audio filters apply where selected."
      - from: mp3
        to: flac
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes FLAC. Sample rate, channel, and advanced audio filter controls are passed when selected; bitrate is not used."
      - from: m4a
        to: flac
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes FLAC through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: flac
        to: flac
        engine: ffmpeg-compatible
        status: stable
        note: "Re-encodes FLAC; bitrate is not used. Advanced audio filters apply where selected."
      - from: wav
        to: flac
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes FLAC through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: wma
        to: flac
        engine: ffmpeg-compatible
        status: stable
        note: "Decodes WMA through FFmpeg and encodes FLAC when the bundled codecs are available. Advanced audio filters apply where selected."
      - from: mp3
        to: wma
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes WMA v2 in an ASF/WMA container through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: m4a
        to: wma
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes WMA v2 in an ASF/WMA container through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: flac
        to: wma
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes WMA v2 in an ASF/WMA container through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: wav
        to: wma
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes WMA v2 in an ASF/WMA container through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: wma
        to: wma
        engine: ffmpeg-compatible
        status: stable
        note: "Re-encodes WMA v2 in an ASF/WMA container. Advanced audio filters apply where selected."
      - from: video
        to: m4a
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and re-encodes AAC in an M4A container through FFmpeg compatibility mode. This is not audio stream copy; optional start/end-second trim and advanced audio filters apply where selected."
      - from: video
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and encodes MP3 through libmp3lame after runtime encoder probing. Advanced audio filters apply where selected."
      - from: video
        to: wav
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and writes PCM WAV through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: video
        to: flac
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and encodes FLAC through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: video
        to: wma
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and encodes WMA v2 through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: video
        to: opus
        engine: ffmpeg-compatible
        status: stable
        note: "Extracts the first audio track and encodes OPUS through FFmpeg compatibility mode. Advanced audio filters apply where selected."
      - from: audio
        to: opus
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes OPUS through libopus after runtime encoder probing. Opus operates natively at 48 kHz (RFC 6716 / RFC 7845) and supports {48k, 24k, 16k, 12k, 8k} Hz with 44.1 kHz auto-resampled. Advanced audio filters apply where selected."
      - from: opus
        to: mp3
        engine: ffmpeg-compatible
        status: stable
        note: "Encodes MP3 through libmp3lame after runtime encoder probing. Advanced audio filters apply where selected."
      - from: opus
