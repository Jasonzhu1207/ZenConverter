[package]
name = "zen-office2pdf-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "zen_office2pdf"
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
office2pdf = { git = "https://github.com/developer0hye/office2pdf.git", rev = "9ca03fecab22a6b4828736b003ee1c5f9551e0dc" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace]

