name: Build and Update Demucs Native SO

on:
  workflow_dispatch:
    inputs:
      auto_commit:
        description: 'Automatically commit and push the new .so back to main'
        required: true
        default: true
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'native/demucs-jni/**'
      - '.github/workflows/build-demucs.yml'

permissions:
  contents: write

concurrency:
  group: build-demucs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demucs-so:
    name: Build Demucs .so (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30

      - name: Build Native Library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cd native/demucs-jni
          bash build-arm64-v8a.sh

      - name: Verify Exported JNI Symbols
        run: |
          set -euo pipefail
          SO_FILE="app/src/main/jniLibs/arm64-v8a/libzen_demucs.so"
          nm -D "$SO_FILE" | grep "Java_" || true
          if ! nm -D "$SO_FILE" | grep -q "Java_org_zenconverter_app_model_StemNative_nativeStemSeparate"; then
            echo "::error::Missing required JNI symbol nativeStemSeparate in $SO_FILE"
            exit 1
          fi
          echo "JNI symbols verified successfully."

      - name: Log Library Metadata
        run: |
          set -euo pipefail
          SO_FILE="app/src/main/jniLibs/arm64-v8a/libzen_demucs.so"
          echo "libzen_demucs.so SHA256: $(sha256sum "$SO_FILE" | awk '{ print $1 }')"
          echo "libzen_demucs.so Size:   $(stat -c '%s bytes' "$SO_FILE")"

      - name: Upload SO Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demucs-arm64-v8a-so
          path: |
            app/src/main/jniLibs/arm64-v8a/libzen_demucs.so
            app/src/main/jniLibs/arm64-v8a/libomp.so
          if-no-files-found: error

      - name: Commit and Push back to main
        if: ${{ github.event_name == 'push' || github.event.inputs.auto_commit == 'true' || github.event.inputs.auto_commit == true }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/src/main/jniLibs/arm64-v8a/libzen_demucs.so
          git add app/src/main/jniLibs/arm64-v8a/libomp.so

          if git diff --staged --quiet; then
            echo "No changes in .so files; skipping commit."
          else
            git commit -m "build(native): update libzen_demucs.so from GitHub Actions"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
